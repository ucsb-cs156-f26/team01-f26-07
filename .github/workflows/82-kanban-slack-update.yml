name: "82-kanban-slack-update.yml"

# Instructions to set up the workflow can be found here:
# <https://ucsb-cs156.github.io/topics/github_actions/workflow_82.html>
#
# This is a thin wrapper around the reusable workflow maintained in
# <https://github.com/ucsb-cs156/workflows/blob/main/.github/workflows/82-kanban-slack-update.yml>
# The start and end dates come from the organization variables
# TEAM01_START_DATE and TEAM01_END_DATE.

on:
  schedule:
    - cron: "0 0,4 * * 3-5"  # 0,4 UTC are 4pm, 8pm Pacific Standard Time on T W R
    - cron: "0 0 * * 1,2,6,0" # runs at 4pm on M F SS
  workflow_dispatch:  # Allows manual triggering

jobs:
  kanban-slack-update:
    uses: ucsb-cs156/workflows/.github/workflows/82-kanban-slack-update.yml@main
    with:
      START_DATE: ${{ vars.TEAM01_START_DATE }}
      END_DATE: ${{ vars.TEAM01_END_DATE }}
    secrets:
      PAT: ${{ secrets.PAT }}
      SLACK_BOT_USER_OAUTH_ACCESS_TOKEN: ${{ secrets.SLACK_BOT_USER_OAUTH_ACCESS_TOKEN }}
